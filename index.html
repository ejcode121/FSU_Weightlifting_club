:root{
  color-scheme:light dark;
  --bg:#E6E9E7; --surface:#F7F8F6; --inset:#EBEEEC;
  --ink:#1B1E23; --ink-2:#434A52; --ink-3:#5A616A;
  --line:#CDD2CF; --line-2:#A9B0AC;
  --accent:#782F40; --accent-ink:#FFFFFF; --accent-text:#6A2638;
  --gold:#CEB888; --gold-ink:#5B4A22;
  --p-red:#C62F3F; --p-blue:#2257B8; --p-yellow:#F0B323; --p-green:#1F8A4C; --p-white:#F5F6F4;
  --blue-ink:#1F4E9E;
  --ok:#17703F; --ok-bg:#DCEFE3; --warn:#8A5A00; --warn-bg:#F9E8B8; --bad:#A8222E; --bad-bg:#F6D9DB;
  --chrome-hi:#F7F9FA; --chrome-mid:#BCC3C9; --chrome-lo:#7B848C;
  --bar-h:58px; --tab-h:66px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101216; --surface:#171A20; --inset:#1F232A;
    --ink:#EDEFEC; --ink-2:#BCC2C9; --ink-3:#98A0A8;
    --line:#2A2F37; --line-2:#444B56;
    --accent:#A8415F; --accent-text:#EBA9BC; --gold-ink:#CEB888;
    --p-white:#E8EBE7; --blue-ink:#86B3FF;
    --ok:#62D69C; --ok-bg:#10301F; --warn:#F2C45C; --warn-bg:#35290D; --bad:#FF918A; --bad-bg:#3C1714;
    --chrome-hi:#E8ECEF; --chrome-mid:#8E979F; --chrome-lo:#4F5760;
  }
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-stretch:100%;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,p,ul,ol,dl,dd,dt,figure{margin:0;padding:0}
ul,ol{list-style:none}
button,input,select,textarea{font:inherit;font-stretch:100%;color:inherit}
button{cursor:pointer}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-64px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:10px;font-weight:600;text-decoration:none}
.skip:focus{top:10px}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px;border-radius:6px}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 20px}
@media(min-width:900px){.wrap{padding:0 40px}}

.disp{font-stretch:62%;font-weight:800;letter-spacing:-.008em;line-height:.92;font-variant-numeric:lining-nums tabular-nums}
.num{font-variant-numeric:lining-nums tabular-nums}
.muted{color:var(--ink-2)}
.hint{font-size:.88rem;color:var(--ink-2);line-height:1.45;max-width:68ch}

/* ---------- app bar + tabs ---------- */
.appbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
.appbar-in{height:var(--bar-h);display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:36px;height:36px;flex:none}
.brand b{display:block;font-stretch:68%;font-weight:800;font-size:1.32rem;line-height:1;letter-spacing:.004em}
.brand small{display:block;font-size:.74rem;color:var(--ink-3);line-height:1.25;margin-top:2px}
.mini{display:flex;align-items:baseline;gap:6px;font-size:.84rem;color:var(--ink-2);white-space:nowrap}
.mini b{font-stretch:66%;font-weight:800;font-size:1.45rem;color:var(--ink);line-height:1}
.mini .st{display:inline-flex;align-items:center;gap:6px;margin-left:6px;font-weight:600;font-size:.8rem;padding:3px 10px 3px 8px;border-radius:999px;background:var(--inset);color:var(--ink-2)}
.mini .st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.mini .st.ok{background:var(--ok-bg);color:var(--ok)}.mini .st.ok::before{background:var(--ok)}
.mini .st.warn{background:var(--warn-bg);color:var(--warn)}.mini .st.warn::before{background:var(--p-yellow)}
.mini .st.bad{background:var(--bad-bg);color:var(--bad)}.mini .st.bad::before{background:var(--bad)}
@media(max-width:520px){.mini .of,.mini .st{display:none}}
.loadline{height:3px;background:var(--line)}
.loadline i{display:block;height:100%;width:0;background:var(--accent);transition:width .7s cubic-bezier(.2,.8,.2,1)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(3,1fr);background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 9px;font-size:.78rem;font-weight:560;color:var(--ink-3);min-height:var(--tab-h)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-selected=true]{color:var(--accent-text)}
.tabs button[aria-selected=true]::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
@media(min-width:900px){
  .tabs{position:static;display:flex;gap:4px;max-width:1180px;margin:0 auto;padding:6px 40px 0;border:0;background:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  .tabs button{flex-direction:row;gap:9px;font-size:.98rem;min-height:46px;padding:8px 18px 8px 14px;border-radius:999px}
  .tabs button svg{width:20px;height:20px}
  .tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink)}
  .tabs button[aria-selected=true]::before{display:none}
}
main{display:block;padding:6px 0 calc(var(--tab-h) + 56px)}
@media(min-width:900px){main{padding-bottom:80px}}
.panel{display:none}.panel.on{display:block}

/* ---------- hero: the bar ---------- */
.hero{padding:26px 0 10px}
.hero-title{font-stretch:62%;font-weight:800;font-size:clamp(3.1rem,13.5vw,6.8rem);line-height:.86;letter-spacing:-.012em;text-wrap:balance;max-width:14ch}
.hero-sub{margin-top:14px;font-size:1.05rem;color:var(--ink-2);max-width:56ch}
.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px;border-top:2px solid var(--ink);margin-top:10px;padding-top:12px}
.readout dt{font-size:.84rem;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.readout dt i{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.readout dt i.ghost{background:none;border:2px dashed var(--ink-3)}
.readout dt i.gap{background:var(--p-yellow)}.readout dt i.ok{background:var(--ok)}
.readout dd{font-stretch:62%;font-weight:800;font-size:clamp(2rem,9.5vw,3.9rem);line-height:.95;letter-spacing:-.01em;margin-top:4px;font-variant-numeric:lining-nums tabular-nums}
.readout dd.ok{color:var(--ok)}.readout dd.warn{color:var(--warn)}.readout dd.bad{color:var(--bad)}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.hero-cta p{font-size:.95rem;color:var(--ink-2);flex:1 1 240px}

/* ---------- sections ---------- */
.block{padding:38px 0 8px;border-top:1px solid var(--line-2);margin-top:30px}
.block.first{border-top:0;margin-top:14px;padding-top:6px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.sec-title{font-stretch:66%;font-weight:800;font-size:clamp(2.1rem,7vw,3.1rem);line-height:.92;letter-spacing:-.006em}
.sec-note{margin-top:8px;color:var(--ink-2);max-width:64ch;font-size:.96rem}

/* ---------- buttons, fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:9px 18px;border-radius:999px;font-weight:600;font-size:.92rem;min-height:42px;line-height:1.1;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ink-3)}
.btn svg{width:18px;height:18px;flex:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent-text);padding-inline:12px}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 14px;font-size:.86rem}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn:hover{color:var(--bad);border-color:var(--bad)}
.icon-btn svg{width:18px;height:18px}
.field{display:flex;flex-direction:column;gap:5px;font-size:.82rem;color:var(--ink-2);font-weight:500;min-width:0}
.field input,.field select,.field textarea,.input{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);font-size:1rem;color:var(--ink);font-weight:450}
.field textarea{min-height:68px;resize:vertical}
.field input:focus-visible,.field select:focus-visible,.field textarea:focus-visible,.input:focus-visible{outline:2px solid var(--accent-text);outline-offset:1px;border-color:transparent}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.switch-row{display:flex;align-items:center;gap:12px;cursor:pointer;font-size:.92rem;font-weight:560}
.switch-row small{display:block;font-weight:400;color:var(--ink-2);font-size:.8rem}
.switch{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--line-2);position:relative;flex:none;transition:background .2s;margin:0;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:transform .2s cubic-bezier(.3,1.4,.5,1);box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(18px)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 8px;border-radius:999px;background:var(--inset);font-size:.84rem;font-weight:520;color:var(--ink-2);border:1px solid var(--line)}
.chip svg{width:15px;height:15px;flex:none}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--gold);color:#3E3114;line-height:1.5}
.tag.in{background:var(--accent);color:var(--accent-ink)}
details.dis>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;font-size:.92rem;color:var(--accent-text);padding:6px 0;min-height:40px}
details.dis>summary::-webkit-details-marker{display:none}
details.dis>summary svg{width:18px;height:18px;transition:transform .2s}
details.dis[open]>summary svg{transform:rotate(180deg)}
details.dis>.dis-body{padding:8px 0 4px;display:grid;gap:12px}

/* ---------- team and goal ---------- */
.setup{border:1px solid var(--line-2);border-radius:20px;background:var(--surface);margin-top:18px}
.setup>summary{list-style:none;cursor:pointer;padding:16px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;align-items:end;position:relative}
.setup>summary::-webkit-details-marker{display:none}
.setup .sf b{display:block;font-stretch:62%;font-weight:800;font-size:1.9rem;line-height:.95}
.setup .sf span{font-size:.8rem;color:var(--ink-2)}
.setup .edit{grid-column:1/-1;display:flex;align-items:center;gap:6px;color:var(--accent-text);font-weight:600;font-size:.9rem}
.setup .edit svg{width:18px;height:18px;transition:transform .2s}
.setup[open] .edit svg{transform:rotate(180deg)}
.setup-body{padding:4px 18px 18px;border-top:1px solid var(--line);display:grid;gap:14px;padding-top:16px}
@media(min-width:760px){.setup>summary{grid-template-columns:repeat(4,1fr) auto}.setup .edit{grid-column:auto}}

/* ---------- schedule ---------- */
.tl{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;margin:6px 0 0}
.tl li{position:relative;padding:22px 6px 0 0;min-width:0}
.tl li::before{content:"";position:absolute;top:6px;left:0;right:0;height:2px;background:var(--ink)}
.tl li::after{content:"";position:absolute;top:0;left:0;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--ink)}
.tl li.meet::after{background:var(--accent);border-color:var(--accent)}
.tl li.last::before{background:linear-gradient(90deg,var(--ink) 0 30%,transparent 30%);right:auto;width:100%}
.tl b{display:block;font-stretch:78%;font-weight:760;font-size:1.02rem;line-height:1.1}
.tl span{display:block;font-size:.82rem;color:var(--ink-2);margin-top:2px}
.tl-note{margin-top:14px}

/* ---------- lodging ---------- */
.gA{--g:var(--p-green);--g-ink:var(--ok)}.gB{--g:var(--p-blue);--g-ink:var(--blue-ink)}.gC{--g:var(--p-yellow);--g-ink:var(--warn)}.gD{--g:var(--p-red);--g-ink:var(--bad)}.gx{--g:var(--line-2);--g-ink:var(--ink-3)}
.toolbar{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin:14px 0 16px}
.cards{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1000px){.cards.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stay{position:relative;background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--g,var(--line-2));border-radius:6px 20px 20px 6px;padding:16px 16px 10px;display:grid;gap:12px;align-content:start}
.stay.sel{outline:2px solid var(--accent-text);outline-offset:2px}
.stay-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.ring{position:relative;display:block;width:58px;height:58px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--line);stroke-width:5}
.ring .val{fill:none;stroke:var(--g);stroke-width:5;stroke-linecap:round}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-stretch:62%;font-weight:800;font-size:1.85rem;color:var(--g-ink);padding-top:1px}
input.name{width:100%;min-width:0;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;font-stretch:72%;font-weight:760;font-size:1.32rem;line-height:1.15;padding:3px 0;min-height:0;letter-spacing:.002em}
input.name:hover{border-bottom-color:var(--line)}
input.name:focus-visible{outline:none;border-bottom-color:var(--accent-text)}
.stay-cost{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.stay-cost b{font-size:2.3rem}
.stay-cost span{font-size:.9rem;color:var(--ink-2)}
.stay-chips{display:flex;flex-wrap:wrap;gap:8px}
.use{position:relative;display:inline-flex;cursor:pointer}
.use .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:8px 16px;font-weight:600;font-size:.88rem;min-height:40px;background:var(--surface);transition:background .15s}
.use .pill svg{width:16px;height:16px}
.use:hover .pill{border-color:var(--ink-3)}
.use input:checked+.pill{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.use input:focus-visible+.pill{outline:2px solid var(--accent-text);outline-offset:2px}
.stay-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* ---------- transport ---------- */
.ride{background:var(--surface);border:1px solid var(--line);border-radius:20px 6px 6px 20px;display:grid;align-content:start}
.ride.sel{outline:2px solid var(--accent-text);outline-offset:2px}
.ride-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;padding:16px 16px 10px;align-items:center}
.ride-ico{width:52px;height:52px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.ride-ico svg{width:28px;height:28px}
.ride select.type{border:0;background:transparent;padding:0 20px 0 0;font-size:.84rem;color:var(--ink-2);min-height:28px;font-weight:560;width:auto;cursor:pointer}
.ride .switch-row{padding:6px 16px 14px}
.ride-cost{border-top:2px dashed var(--line-2);padding:14px 16px;display:grid;gap:10px}
.ride-line{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 12px}
.ride-line .lab{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.92rem}
.ride-line .lab svg{width:17px;height:17px;color:var(--ink-3)}
.ride-line b{font-size:1.9rem}
.ride-line small{grid-column:1/-1;color:var(--ink-2);font-size:.82rem}
.ride .dis{padding:0 16px 8px;border-top:1px solid var(--line)}

/* ---------- picks + matrix ---------- */
.picks{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin:6px 0 18px}
.pick{text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:6px 18px 18px 6px;padding:14px 16px;display:grid;gap:4px;border-left:8px solid var(--gold)}
.pick:hover{border-color:var(--ink-3);border-left-color:var(--gold)}
.pick .why{font-weight:700;font-size:.9rem;color:var(--gold-ink)}
.pick b{font-stretch:72%;font-weight:760;font-size:1.18rem;line-height:1.15}
.pick .pr{display:flex;align-items:baseline;gap:10px;margin-top:2px}
.pick .pr strong{font-stretch:62%;font-weight:800;font-size:2rem;line-height:1}
.pick small{color:var(--ink-2);font-size:.84rem}
.mx-wrap{overflow-x:auto;margin:0 -20px;padding:0 20px 8px;-webkit-overflow-scrolling:touch}
@media(min-width:900px){.mx-wrap{margin:0;padding:0 0 8px}}
table.mx{border-collapse:separate;border-spacing:8px;margin:-8px;font-size:.88rem}
table.mx th{font-weight:600;text-align:left;vertical-align:bottom}
table.mx thead th{padding:6px 4px 8px;min-width:150px;max-width:190px;font-stretch:78%;font-size:.98rem;line-height:1.15}
table.mx thead th .nt{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-stretch:100%;font-weight:600;font-size:.76rem;color:var(--ink-2);background:var(--inset);border:1px solid var(--line);border-radius:999px;padding:1px 9px 1px 7px}
table.mx thead th .nt svg{width:13px;height:13px}
table.mx thead th .tt{display:flex;align-items:center;gap:7px}
table.mx thead th .tt svg{width:18px;height:18px;flex:none;color:var(--accent-text)}
table.mx tbody th{position:sticky;left:0;z-index:2;background:var(--bg);min-width:150px;max-width:170px;padding:6px 10px 6px 0;vertical-align:middle;font-stretch:78%;font-size:.98rem;line-height:1.15}
table.mx tbody th .rl{display:flex;align-items:center;gap:9px}
table.mx tbody th small{display:block;font-stretch:100%;font-weight:450;color:var(--ink-2);font-size:.78rem;margin-top:2px}
.gchip{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--g);color:var(--bg);font-stretch:62%;font-weight:800;font-size:1.05rem;flex:none}
.gchip.gC{color:#2A2108}.gchip.gx{background:none;border:1.5px dashed var(--line-2);color:var(--ink-3)}
.cell{width:100%;text-align:left;display:grid;gap:2px;padding:10px 12px 10px 14px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--st,var(--line-2));border-radius:4px 12px 12px 4px;min-height:96px;align-content:start;transition:border-color .15s}
.cell:hover{border-color:var(--ink-3);border-left-color:var(--st)}
.cell.ok{--st:var(--ok)}.cell.warn{--st:var(--p-yellow)}.cell.bad{--st:var(--bad)}
.cell .ct{font-stretch:62%;font-weight:800;font-size:1.7rem;line-height:1}
.cell .pp{font-size:.82rem;color:var(--ink-2)}
.cell .dl{font-size:.8rem;font-weight:650}
.cell.ok .dl{color:var(--ok)}.cell.warn .dl{color:var(--warn)}.cell.bad .dl{color:var(--bad)}
.cell .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.cell.sel{outline:2px solid var(--accent-text);outline-offset:1px}

/* ---------- jobs ---------- */
.finder{display:grid;gap:14px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--ink-3);pointer-events:none}
.search input{padding-left:44px;min-height:50px;border-radius:999px;font-size:1.02rem}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
@media(min-width:900px){.chips{flex-wrap:wrap;overflow:visible;margin:0;padding:2px 0}}
.cat{flex:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:7px 14px 7px 10px;font-size:.88rem;font-weight:580;min-height:40px}
.cat svg{width:18px;height:18px}
.cat[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filter-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.jobs{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));margin-top:6px}
.job{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:11px;position:relative}
.job.inplan{border-color:var(--accent-text);box-shadow:inset 6px 0 0 var(--accent)}
.job-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start}
.cat-ico{width:42px;height:42px;border-radius:12px;background:var(--inset);display:grid;place-items:center;color:var(--accent-text);border:1px solid var(--line)}
.cat-ico svg{width:23px;height:23px}
.job h3{font-stretch:76%;font-weight:760;font-size:1.22rem;line-height:1.1}
.job .cn{font-size:.78rem;color:var(--ink-3);margin-top:3px;font-weight:500}
.job-pay{text-align:right}
.job-pay b{display:block;font-stretch:62%;font-weight:800;font-size:2.5rem;line-height:.9;color:var(--accent-text)}
.job-pay small{font-size:.76rem;color:var(--ink-2)}
.job .desc{font-size:.92rem;color:var(--ink-2)}
.job .brk{font-size:.82rem;color:var(--ink-3)}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.job .where{font-size:.86rem;color:var(--ink-2)}
.job .where b{color:var(--ink);font-weight:650}
.links{display:flex;gap:4px 14px;flex-wrap:wrap}
.links a{font-size:.84rem;font-weight:600;color:var(--accent-text);text-underline-offset:3px;padding:4px 0}
.job-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.need{display:grid;gap:5px;min-width:0}
.need span{font-size:.82rem;color:var(--ink-2)}
.pips{display:flex;gap:4px;flex-wrap:wrap}
.pip{width:13px;height:22px;border-radius:3px;border:1.5px solid var(--line-2)}
.pip.on{background:var(--accent);border-color:var(--accent)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:999px;background:var(--surface);flex:none}
.stepper button{width:44px;height:44px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.stepper button:hover{background:var(--inset)}
.stepper button svg{width:20px;height:20px}
.stepper output{min-width:5.4ch;text-align:center;font-weight:700;font-size:.92rem;line-height:1.1}
.stepper output small{display:block;font-weight:450;color:var(--ink-2);font-size:.7rem}
.empty{padding:34px 18px;text-align:center;color:var(--ink-2);border:1.5px dashed var(--line-2);border-radius:16px;grid-column:1/-1}
.empty b{display:block;color:var(--ink);font-stretch:72%;font-size:1.3rem;font-weight:760;margin-bottom:4px}
.empty .btn{margin-top:14px}

/* ---------- plan ---------- */
.plan-grid{display:grid;gap:34px}
@media(min-width:1000px){.plan-grid{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);align-items:start}}
.shift-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.shift-row:first-child{border-top:1px solid var(--line-2)}
.shift-row b{font-stretch:76%;font-weight:760;font-size:1.12rem;line-height:1.15;display:block}
.shift-row small{color:var(--ink-2);font-size:.84rem}
.shift-row .sub{font-stretch:62%;font-weight:800;font-size:1.6rem;text-align:right;line-height:1}
.chart{width:100%;height:auto;overflow:visible}
.chart text{fill:var(--ink-2);font-size:13px;font-family:inherit}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--ink-3);stroke-width:1.2}
.chart .goal-l{stroke:var(--gold);stroke-width:2.5;stroke-dasharray:6 5}
.chart .area{fill:var(--accent);opacity:.14}
.chart .line{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .mk{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 4}
.chart .col{fill:var(--accent)}.chart .col.low{fill:var(--accent);opacity:.5}
.chart .tgt{stroke:var(--gold);stroke-width:2.5;stroke-dasharray:6 5}
.chart .lbl-strong{fill:var(--ink);font-weight:700}
.notes{display:grid;gap:8px;margin-top:12px;font-size:.92rem;color:var(--ink-2)}
.notes li{display:flex;gap:10px;align-items:flex-start}
.notes li i{width:10px;height:10px;border-radius:50%;margin-top:7px;flex:none;background:var(--ink-3)}
.notes li i.ok{background:var(--ok)}.notes li i.bad{background:var(--bad)}.notes li i.gold{background:var(--gold)}
.verdict{border-left:8px solid var(--st,var(--line-2));background:var(--surface);border-radius:6px 18px 18px 6px;padding:18px 20px;font-size:1.04rem}
.verdict.ok{--st:var(--ok)}.verdict.bad{--st:var(--bad)}.verdict.warn{--st:var(--p-yellow)}
.verdict b{font-stretch:70%;font-weight:800;font-size:1.7rem;display:block;line-height:1.05;margin-bottom:4px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 18px);transform:translate(-50%,24px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:600;font-size:.92rem;max-width:calc(100% - 32px);text-align:center;z-index:80;transition:opacity .25s,transform .35s cubic-bezier(.2,.9,.3,1.2)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:900px){#toast{bottom:28px}}
footer{padding:30px 0 20px;color:var(--ink-3);font-size:.82rem}
footer p{max-width:78ch}

/* ---------- dialog ---------- */
dialog{border:0;border-radius:22px;padding:22px;max-width:620px;width:calc(100% - 20px);max-height:92vh;overflow:auto;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(8,10,14,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog h2{font-stretch:66%;font-weight:800;font-size:2.1rem;line-height:.95;margin-bottom:14px}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchips label{display:inline-flex;align-items:center;gap:6px;font-size:.86rem;border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:36px}
.mchips input{margin:0;accent-color:var(--accent)}
.sub-h{font-size:.84rem;color:var(--ink-2);font-weight:560;margin:14px 0 6px}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
@media print{
  .appbar,.tabs,#toast,.btn,.stepper,.skip,.toolbar,.hero-cta,.chips,.search,.icon-btn,.use,.switch-row{display:none!important}
  body{background:#fff;color:#000}
  .panel{display:block!important}
  .plate,.cell,.verdict,.stay,.ride{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .block{break-inside:avoid}
}

/* icons: <svg class="i"><use href="#i-name"/></svg> */
.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* progress bar */
.bar-fig{margin:22px 0 4px}
.prog{position:relative;height:56px;border-radius:14px;background:var(--inset);border:1px solid var(--line-2);overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:13px 0 0 13px;min-width:0}
.prog-fill.ok{background:var(--ok);border-radius:13px}
.prog-fill.grow{animation:prog-grow .9s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes prog-grow{from{width:0}}
.prog-pct{position:absolute;top:50%;transform:translate(10px,-50%);font-stretch:62%;font-weight:800;font-size:1.7rem;line-height:1;color:var(--ink)}
.prog-pct.in{transform:translate(calc(-100% - 12px),-50%);color:#fff}
.prog-scale{display:flex;justify-content:space-between;margin-top:8px;font-size:.84rem;color:var(--ink-2)}

.hero-title{font-size:clamp(2.6rem,10vw,4.6rem)}

/* live links */
.stamp{font-size:.9rem;font-weight:600;color:var(--ink-2);background:var(--inset);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.live-h{font-size:.84rem;font-weight:600;color:var(--ink-2);margin:18px 0 8px}
.live-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.live-link{display:grid;gap:2px;padding:12px 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);text-decoration:none;color:var(--ink);min-height:56px;align-content:center}
.live-link:hover{border-color:var(--accent-text)}
.live-link span{font-weight:650}
.live-link small{color:var(--ink-3);font-size:.78rem}
.live-link .tag{font-style:normal;margin-left:4px}
.live-picks{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.live-pick{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;display:grid;gap:6px}
.live-pick b{font-stretch:76%;font-weight:760;font-size:1.1rem;line-height:1.1}
.live-pick-links{display:flex;flex-wrap:wrap;gap:2px 12px}
.live-pick-links a{font-size:.84rem;font-weight:600;color:var(--accent-text);text-underline-offset:3px;padding:4px 0}

/* maps */
.map-wrap{border:1px solid var(--line-2);border-radius:20px;background:var(--surface);margin:14px 0 18px;overflow:hidden}
.map-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 0}
.map-bar-r{display:flex;align-items:center;gap:8px}
.icon-btn.sm{width:34px;height:34px}.icon-btn.sm svg{width:16px;height:16px}
.zoom{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;overflow:hidden}
.zoom button{border:0;background:none;padding:7px 14px;font-weight:600;font-size:.84rem;min-height:36px}
.zoom button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
svg.map{width:100%;height:auto;max-height:520px}
.map .ring-l{fill:none;stroke:var(--line-2);stroke-width:1;stroke-dasharray:3 5}
.map .ring-t{fill:var(--ink-3);font-size:11px}
.map .venue polygon{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.map .venue-t{fill:var(--ink);font-size:13px;font-weight:700}
.map .route-l{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.map .leader{stroke:var(--ink-3);stroke-width:1.2;stroke-dasharray:2 3}
.map .pin{cursor:pointer;outline:none}
.map .pin .hit{fill:transparent}
.map .pin text{text-anchor:middle;dominant-baseline:central;font-stretch:62%;font-weight:800;font-size:17px;fill:#fff;pointer-events:none}
.map .pin.gC text{fill:#2A2108}
.map .pin.trip .dot{fill:var(--g);stroke:var(--bg);stroke-width:2.5}
.map .pin.trip.sel .dot{stroke:var(--ink);stroke-width:3.5}
.map .pin.disc .dot{fill:var(--surface);stroke:var(--ink-3);stroke-width:2.2}
.map .pin.rt .dot{fill:var(--accent);stroke:var(--bg);stroke-width:2.5}
.map .pin:hover .dot,.map .pin:focus-visible .dot{stroke:var(--accent-text);stroke-width:3.5}
.map-legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:0 14px 12px;font-size:.84rem;color:var(--ink-2)}
.map-legend span{display:inline-flex;align-items:center;gap:7px}
.lg{width:12px;height:12px;border-radius:50%;display:inline-block}
.lg.trip{background:var(--p-green)}.lg.disc{border:2px solid var(--ink-3)}.lg.ven{background:var(--accent);border-radius:3px;transform:rotate(45deg) scale(.85)}
.pop{position:absolute;z-index:70;width:300px;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:16px;box-shadow:0 14px 40px rgba(0,0,0,.28);display:grid;gap:10px}
.pop[hidden]{display:none}
.pop h3{font-stretch:76%;font-weight:760;font-size:1.2rem;line-height:1.1;padding-right:34px}
.pop-x{position:absolute;top:8px;right:8px}
.chips-row{display:flex;flex-wrap:wrap;gap:6px}
.pop-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pop-actions .btn{padding-inline:10px;text-decoration:none}
.pop-list{display:grid;gap:2px;font-size:.88rem}
.pop-list a{color:var(--accent-text);text-underline-offset:3px;font-weight:600;display:inline-block;padding:3px 0}
@media(max-width:700px){.pop{position:fixed;left:12px;right:12px;bottom:calc(var(--tab-h) + 12px);width:auto;top:auto!important}}
.map .venue,.map .venue-t,.map .ring-t{pointer-events:none}
.zoom button,.stamp{white-space:nowrap}
@media(max-width:700px){.map .pin.trip .dot,.map .pin.rt .dot{r:16px}.map .pin.disc .dot{r:9px}.map .pin text{font-size:21px}.map .venue-t{font-size:16px}}

</style>

 // ---- dated group events (whole team or 5-person crews) ----

function transportCost(t, n = baseNights()) {

    case "van": { const u = Math.max(1, Math.ceil(p / Math.max(1, num(t.seats)))), rd = daysFor(n) + num(t.extra);

const clamp01 = x => Math.max(0, Math.min(1, x));

function lodgingGrade(l) {
  if (l.miles === null || l.miles === undefined || l.miles === "") return null;
  const g = S.grade, n = baseNights(), people = Math.max(1, num(S.team.people));
  const pp = lodgingCost(l, n).total / people / n;
  const d = clamp01(1 - (num(l.miles) - num(g.near)) / Math.max(.1, num(g.far) - num(g.near)));
  const c = clamp01(1 - (pp - num(g.cheap)) / Math.max(1, num(g.pricey) - num(g.cheap)));
  const w = clamp01(num(g.wDist) / 100);
  const score = Math.round((w * d + (1 - w) * c) * 100);

}

/* ================= map + discovery =================
   Sources (all keyless, CORS-enabled, fetched when the page opens and cached in this browser):
   - OpenStreetMap Overpass: hotels, motels, guest houses, apartments, hostels near the venue; car-rental branches near Tallahassee
   - OSRM: real road miles and drive minutes; the Tallahassee to Richmond route
   - Nominatim: turns an Airbnb address into a map position
   Airbnb has no public data feed, so Airbnb stays come in through "Add by link" and sit on the same map. */
const VENUE = { lat: 37.5444, lon: -77.4349, name: "Greater Richmond Convention Center" };
const ORIGIN = { lat: 30.4418, lon: -84.2985, name: "Tallahassee" };
const AIRPORTS = { tlh: { lat: 30.3965, lon: -84.3503 }, ric: { lat: 37.5052, lon: -77.3197 } };
const DKEY = "fsu-lifting-discover-v1", DAYMS = 864e5;
const STAY_TYPES = { hotel: ["Hotel", 150, 4], motel: ["Motel", 110, 4], guest_house: ["Guest house", 180, 6], apartment: ["Apartment", 200, 6], hostel: ["Hostel", 45, 1], chalet: ["Chalet", 260, 8] };
function loadD() { try { const d = JSON.parse(localStorage.getItem(DKEY)); if (d && d.v === 1) return d; } catch (e) {} return { v: 1, ts: 0, stays: [], rentals: [], route: null }; }
let D = loadD(), dStatus = D.ts ? "saved" : "idle", dBusy = false, zoom = 0;
const saveD = () => { try { localStorage.setItem(DKEY, JSON.stringify(D)); } catch (e) {} };
const hav = (a, b, c, d) => { const r = x => x * Math.PI / 180, dl = r(c - a), dn = r(d - b), h = Math.sin(dl / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(dn / 2) ** 2; return 7917.6 * Math.asin(Math.sqrt(h)); };
const gmap = q => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
const fullUrl = u => !u ? "" : /^https?:/i.test(u) ? u : "https://" + u;
async function getJSON(url, opt = {}) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), opt.ms || 15000);
  try { const r = await fetch(url, { ...opt, signal: c.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); } finally { clearTimeout(t); }
}
const overpass = q => getJSON("https://overpass-api.de/api/interpreter", { method: "POST", body: new URLSearchParams({ data: q }), ms: 25000 });
const elLL = e => ({ lat: e.lat ?? (e.center && e.center.lat), lon: e.lon ?? (e.center && e.center.lon) });

async function fetchStays() {
  const j = await overpass(`[out:json][timeout:25];nwr["tourism"~"^(hotel|motel|guest_house|apartment|hostel|chalet)$"]["name"](around:16000,${VENUE.lat},${VENUE.lon});out center tags 90;`);
  let list = (j.elements || []).map(e => { const p = elLL(e), t = e.tags || {}; if (p.lat == null) return null;
    return { id: `osm-${e.type[0]}${e.id}`, name: t.name, type: t.tourism, lat: p.lat, lon: p.lon, web: t.website || t["contact:website"] || "", rooms: +t.rooms || 0 }; }).filter(Boolean);
  list.forEach(s => { s.miles = +(hav(VENUE.lat, VENUE.lon, s.lat, s.lon) * 1.3).toFixed(1); s.mins = Math.round(s.miles / .4); s.road = false; });
  list = list.sort((a, b) => a.miles - b.miles).slice(0, 60);
  try {
    const co = [VENUE, ...list].map(p => `${p.lon},${p.lat}`).join(";");
    const r = await getJSON(`https://router.project-osrm.org/table/v1/driving/${co}?destinations=0&annotations=distance,duration`);
    list.forEach((s, i) => { const d = r.distances && r.distances[i + 1] && r.distances[i + 1][0], t = r.durations && r.durations[i + 1] && r.durations[i + 1][0];
      if (d != null && t != null) { s.miles = +(d / 1609.34).toFixed(1); s.mins = Math.round(t / 60); s.road = true; } });
  } catch (e) {}
  return list;
}
async function fetchRoute() {
  const r = await getJSON(`https://router.project-osrm.org/route/v1/driving/${ORIGIN.lon},${ORIGIN.lat};${VENUE.lon},${VENUE.lat}?overview=simplified&geometries=geojson`);
  const rt = r.routes[0], c = rt.geometry.coordinates, k = Math.max(1, Math.ceil(c.length / 150));
  return { miles: rt.distance / 1609.34, mins: rt.duration / 60, pts: c.filter((_, i) => i % k === 0 || i === c.length - 1) };
}
async function fetchRentals() {
  const j = await overpass(`[out:json][timeout:25];nwr["amenity"="car_rental"]["name"](around:20000,${ORIGIN.lat},${ORIGIN.lon});out center tags 30;`);
  return (j.elements || []).map(e => { const p = elLL(e), t = e.tags || {}; return p.lat == null ? null : { name: t.name, lat: p.lat, lon: p.lon, web: t.website || t["contact:website"] || "" }; }).filter(Boolean)
    .sort((a, b) => hav(ORIGIN.lat, ORIGIN.lon, a.lat, a.lon) - hav(ORIGIN.lat, ORIGIN.lon, b.lat, b.lon)).slice(0, 12);
}
async function discover() {
  if (dBusy) return; dBusy = true; dStatus = "loading"; renderMaps();
  const [s, r, v] = await Promise.allSettled([fetchStays(), fetchRoute(), fetchRentals()]);
  let ok = 0;
  if (s.status === "fulfilled") { D.stays = s.value; ok++; }
  if (r.status === "fulfilled") { D.route = r.value; ok++; }
  if (v.status === "fulfilled") { D.rentals = v.value; ok++; }
  if (ok) { D.ts = Date.now(); saveD(); }
  dStatus = ok ? "live" : D.ts ? "saved" : "offline"; dBusy = false; renderMaps();
}
function autoDiscover() { if (Date.now() - D.ts > DAYMS && navigator.onLine !== false) discover(); }
const statusText = () => dStatus === "loading" ? "Loading" : dStatus === "offline" ? "Offline" : D.ts ? `Updated ${new Date(D.ts).toLocaleDateString("en-US", { month: "short", day: "numeric" })}` : "No data";
const routeMiles = () => D.route ? D.route.miles : hav(ORIGIN.lat, ORIGIN.lon, VENUE.lat, VENUE.lon) * 1.2;
const routeMins = () => D.route ? D.route.mins : routeMiles() / .8;
const hm = m => `${Math.floor(m / 60)}h ${String(Math.round(m % 60)).padStart(2, "0")}m`;

/* ---------- stay map ---------- */
const cosV = Math.cos(VENUE.lat * Math.PI / 180);
const xyMi = (lat, lon) => ({ dx: (lon - VENUE.lon) * 69.17 * cosV, dy: (lat - VENUE.lat) * 69.05 });
function lodgingPos(l) {
  if (l.lat != null && l.lon != null) return { lat: l.lat, lon: l.lon, approx: false };
  let h = 0; for (const ch of String(l.id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const a = (h % 360) * Math.PI / 180, mi = (l.miles === null || l.miles === undefined || l.miles === "") ? 3 : num(l.miles);
  return { lat: VENUE.lat + Math.sin(a) * mi / 69.05, lon: VENUE.lon + Math.cos(a) * mi / (69.17 * cosV), approx: true };
}
function stayItems() {
  const have = new Set(S.lodging.map(l => l.srcId).filter(Boolean));
  const trip = S.lodging.map(l => { const p = lodgingPos(l); return { k: "trip", id: l.id, name: l.name, ...p, ...xyMi(p.lat, p.lon), l }; });
  const disc = D.stays.filter(s => !have.has(s.id)).map(s => ({ k: "disc", id: s.id, name: s.name, lat: s.lat, lon: s.lon, ...xyMi(s.lat, s.lon), s }));
  return [...disc, ...trip].map(i => ({ ...i, dist: Math.hypot(i.dx, i.dy) }));
}
const mapBar = (zoomOn, Z) => `<div class="map-bar">${zoomOn ? `<div class="zoom" role="group" aria-label="Map zoom">${[3, 6, 12, 24].map(z => `<button type="button" data-zoom="${z}" aria-pressed="${Z === z}">${z} mi</button>`).join("")}</div>` : "<span></span>"}
  <span class="map-bar-r"><span class="stamp">${statusText()}</span><button class="icon-btn sm" type="button" data-refresh aria-label="Refresh map data" ${dBusy ? "disabled" : ""}>${ico("reset")}</button></span></div>`;
function renderStayMap() {

  const items = stayItems(), tripMax = Math.max(0, ...items.filter(i => i.k === "trip").map(i => i.dist));

}

/* ---------- route map ---------- */
function renderRouteMap() {
  const el = $("#routeMap"); if (!el) return;
  const pts = D.route ? D.route.pts : [[ORIGIN.lon, ORIGIN.lat], [VENUE.lon, VENUE.lat]];
  const lons = pts.map(p => p[0]), lats = pts.map(p => p[1]), midLat = (Math.min(...lats) + Math.max(...lats)) / 2, k = Math.cos(midLat * Math.PI / 180);
  const minLon = Math.min(...lons), minLat = Math.min(...lats), w = (Math.max(...lons) - minLon) * k, h = Math.max(...lats) - minLat, pad = 56;
  const sc = Math.min((640 - 2 * pad) / w, (320 - 2 * pad) / h), ox = (640 - w * sc) / 2, oy = (320 - h * sc) / 2;
  const P = (lon, lat) => [ox + (lon - minLon) * k * sc, 320 - oy - (lat - minLat) * sc];
  const path = pts.map((p, i) => { const q = P(p[0], p[1]); return `${i ? "L" : "M"}${q[0].toFixed(1)} ${q[1].toFixed(1)}`; }).join("");

    <text class="venue-t" x="${v[0]}" y="${v[1] - 20}" text-anchor="middle">Richmond</text><text class="venue-t" x="${o[0]}" y="${o[1] - 18}" text-anchor="middle">Tallahassee</text></svg>
    <div class="map-legend"><span>${Math.round(oneWay).toLocaleString()} mi one way</span><span>${hm(routeMins())} drive</span><span><i class="lg ven"></i>Venue</span></div>`;

async function geoStay(addr) {
  const r = await getJSON(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(addr)}`);
  if (!r.length) throw new Error("none");
  const lat = +r[0].lat, lon = +r[0].lon; let miles, mins;
  try { const rt = (await getJSON(`https://router.project-osrm.org/route/v1/driving/${lon},${lat};${VENUE.lon},${VENUE.lat}?overview=false`)).routes[0]; miles = +(rt.distance / 1609.34).toFixed(1); mins = Math.round(rt.duration / 60); }
  catch (e) { miles = +(hav(lat, lon, VENUE.lat, VENUE.lon) * 1.3).toFixed(1); mins = Math.round(miles / .4); }
  return { lat, lon, miles, mins };
}

  if (F.area && j.area !== F.area && !(F.area === "near" && j.area === "campus") && !(F.area === "city")) return false;
  if (F.when && !j.when.includes(F.when)) return false;
  if (F.month && !inSeason(j, +F.month)) return false;
  if (F.few && !(earn(j) > 0 && Math.ceil(target() / earn(j)) <= 2)) return false;
  if (F.q) {
    const hay = `${j.title} ${j.cat} ${j.desc} ${j.how} ${j.when.join(" ")} ${j.area === "campus" ? "campus on-campus fsu" : j.area}`.toLowerCase();
    if (!F.q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w))) return false;
  }
  return true;
}
const AREA = { campus: "On campus", near: "Within ~3 mi", city: "Around Tallahassee" };
const WHEN = { weekday: "Weekdays", evening: "Evenings", weekend: "Weekends" };
const seasonText = j => (!j.months || j.months.length === 12) ? "Year-round" : j.months.map(m => MONTHS[m - 1]).join(", ");
const enc = encodeURIComponent;
function searchLinks(j) {
  if (!j.query) return "";
  const q = enc(j.query);
  return `<a href="https://www.indeed.com/jobs?q=${q}&l=Tallahassee%2C+FL&radius=10" target="_blank" rel="noopener">Indeed</a>
    <a href="https://fsu.joinhandshake.com/stu/postings?query=${q}" target="_blank" rel="noopener">Handshake</a>
    <a href="https://tallahassee.craigslist.org/search/ggg?query=${q}" target="_blank" rel="noopener">Craigslist gigs</a>`;
}
const stepper = n => `<div class="stepper"><button type="button" data-step="-1" aria-label="Fewer shifts">${ico("minus")}</button><output><b>${n}</b><small>/ month</small></output><button type="button" data-step="1" aria-label="More shifts">${ico("plus")}</button></div>`;

  $("#jobList").innerHTML = list.map(j => {

function startDate() {
  const [y, m] = (S.team.start || "").split("-").map(Number);
  const b = (y && m) ? new Date(y, m - 1, 1) : new Date();
  return new Date(b.getFullYear(), b.getMonth(), 1);
}
function renderCum() {
  const ms = monthsList(), p = num(S.team.people), g = goal(), N = ms.length;
  const t0 = startDate(), t1 = new Date(t0.getFullYear(), t0.getMonth() + N, 1);
  const te = ms.map(m => monthEarn(m.cal) * p);
  const cumAt = d => { let s = 0; for (let i = 0; i < N; i++) { const a = new Date(t0.getFullYear(), t0.getMonth() + i, 1), b = new Date(t0.getFullYear(), t0.getMonth() + i + 1, 1);
    if (d >= b) s += te[i]; else if (d > a) s += te[i] * (d - a) / (b - a); } return s; };
  const total = cumAt(t1), top = Math.max(g, total) * 1.1 || 1;
  const step = [100, 200, 250, 500, 1000, 2000, 2500, 5000, 10000, 20000, 25000].find(s => top / s <= 5) || 50000;
  const ymax = Math.ceil(top / step) * step;
  const W = 640, H = 300, L = 54, R = 14, T = 24, B = 34, pw = W - L - R, ph = H - T - B;
  const X = d => L + (d - t0) / (t1 - t0) * pw, Y = v => T + ph - v / ymax * ph;
  let grid = "", i = 0;
  for (let v = 0; v <= ymax; v += step) { grid += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${usdK(v)}</text>`; i++; }
  const pts = [[t0, 0], ...ms.map((m, k) => [new Date(t0.getFullYear(), t0.getMonth() + k + 1, 1), cumAt(new Date(t0.getFullYear(), t0.getMonth() + k + 1, 1))])];
  const path = pts.map(([d, v], k) => `${k ? "L" : "M"}${X(d).toFixed(1)} ${Y(v).toFixed(1)}`).join("");
  const area = `${path}L${X(t1).toFixed(1)} ${Y(0)}L${L} ${Y(0)}Z`;
  const xl = ms.map((m, k) => { const a = new Date(t0.getFullYear(), t0.getMonth() + k, 1), b = new Date(t0.getFullYear(), t0.getMonth() + k + 1, 1);
    return `<text x="${((X(a) + X(b)) / 2).toFixed(1)}" y="${H - 12}" text-anchor="middle">${m.label.slice(0, 3)}</text>`; }).join("");
  const meetD = S.trip.meetDay ? new Date(S.trip.meetDay + "T12:00:00") : new Date(2027, 3, 15);
  const mark = (d, label, dy) => (d > t0 && d < t1) ? `<line class="mk" x1="${X(d)}" x2="${X(d)}" y1="${T}" y2="${T + ph}"/><text x="${X(d) - 5}" y="${T + 12 + dy}" text-anchor="end" class="lbl-strong">${label}</text>` : "";
  const svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Team total raised over time, ending at ${usd(total)} against a ${usd(g)} goal">
    ${grid}<line class="axis" x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}"/>
    <line class="goal-l" x1="${L}" x2="${W - R}" y1="${Y(g)}" y2="${Y(g)}"/><text x="${L + 6}" y="${Y(g) - 7}" class="lbl-strong">Goal ${usd(g)}</text>
    <path class="area" d="${area}"/><path class="line" d="${path}"/>${mark(EARLY.date, "Early-bird entry closes", 14)}${mark(meetD, "Meet", 0)}${xl}</svg>`;
  $("#cumChart").innerHTML = svg;
}
function renderMonthChart() {
  const ms = monthsList(), t = target(), W = 640, H = 260, L = 12, R = 12, T = 30, B = 30, ph = H - T - B;
  const vals = ms.map(m => monthEarn(m.cal)), max = Math.max(t * 1.35, ...vals, 1);
  const bw = (W - L - R) / ms.length, Y = v => T + ph - v / max * ph;
  const cols = ms.map((m, i) => { const v = vals[i], x = L + i * bw + bw * .16, w = bw * .68, h = Math.max(v ? 2 : 0, v / max * ph);
    return `<rect class="col ${v >= t ? "" : "low"}" x="${x}" y="${T + ph - h}" width="${w}" height="${h}" rx="4"/>
      <text x="${x + w / 2}" y="${T + ph - h + 18}" text-anchor="middle" style="fill:#fff;font-weight:700">${v && h > 26 ? usd(v) : ""}</text>
      <text x="${x + w / 2}" y="${H - 10}" text-anchor="middle">${m.label.slice(0, 3)}</text>`; }).join("");
  $("#monthChart").innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Earnings per lifter each month against a ${usd(t)} target">
    <line class="axis" x1="${L}" x2="${W - R}" y1="${T + ph}" y2="${T + ph}"/>${cols}
    <line class="tgt" x1="${L}" x2="${W - R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${W - R}" y="${T - 12}" text-anchor="end" class="lbl-strong">Target ${usd(t)}</text></svg>`;
}
function renderResult() {
  const ms = monthsList(), g = goal(), raised = plannedTotal(), per = ms.reduce((s, m) => s + monthEarn(m.cal), 0), gap = raised - g, nd = neededPerMonth(), p = Math.max(1, num(S.team.people));
  const cls = raised === 0 ? "" : gap >= 0 ? "ok" : "bad";
  $("#result").innerHTML = `<div class="verdict ${cls}"><b>${raised === 0 ? "No shifts" : gap >= 0 ? `Covered, ${usd(gap)} to spare` : `${usd(-gap)} short`}</b>
    ${raised === 0 ? "" : `${usd(per)} per lifter, ${usd(per / ms.length, 2)} a month`}</div>`;
}

function suggestPlan() {
  const ms = monthsList(), nd = neededPerMonth() * 1.05;
  const ok = S.jobs.filter(j => !j.group && earn(j) > 0 && ms.every(m => inSeason(j, m.cal)));
  if (!ok.length || nd <= 0) { toast("No jobs to suggest."); return; }
  const plan = {}; let rem = nd, count = 0;
  while (rem > 0 && count < 4) {
    const fits = ok.filter(j => earn(j) >= rem).sort((a, b) => earn(a) - earn(b) || hourly(b) - hourly(a))[0];
    const pick = fits || ok.slice().sort((a, b) => earn(b) - earn(a) || hourly(b) - hourly(a))[0];
    plan[pick.id] = (plan[pick.id] || 0) + 1; rem -= earn(pick); count++;
  }
  S.plan = plan; save(); renderJobs(); renderPlan(); renderHeroes(); renderSetupFacts();
  const names = Object.keys(plan).map(id => S.jobs.find(j => j.id === id).title);
  toast(`Plan set: ${names.join(", ")}`);
}

function listHandlers(rootSel, listName, selKey, rerender) {
  const root = $(rootSel);
  const item = e => { const o = e.target.closest("[data-id]"); return o && S[listName].find(x => x.id === o.dataset.id); };
  root.addEventListener("input", e => {
    const it = item(e), k = e.target.dataset.k; if (!it || !k || k === "type") return;
    const t = e.target;
    it[k] = t.type === "checkbox" ? t.checked
      : t.type === "number" ? ((t.dataset.opt !== undefined && t.value === "") ? null : num(t.value)) : t.value;
    if (it.est && k !== "name" && k !== "url" && k !== "redeye" && (listName === "transport" || ["nightly", "cleaning", "service"].includes(k))) it.est = false;
    save(); refreshLight();
  });
  root.addEventListener("change", e => {
    const it = item(e), k = e.target.dataset.k; if (!it || k !== "type") return;
    it.type = e.target.value; Object.entries(TDEF[it.type]).forEach(([kk, v]) => { if (it[kk] === undefined) it[kk] = v; });
    it.redeye = TDEF[it.type].redeye;
    save(); keepFocus(rerender); refreshLight();
  });
  root.addEventListener("toggle", e => {
    const id = e.target.dataset && e.target.dataset.open; if (!id) return;
    e.target.open ? openCards.add(id) : openCards.delete(id);
  }, true);
  root.addEventListener("click", e => {
    const it = item(e); if (!it) return;
    if (e.target.matches("[data-pick]")) {
      S[selKey] = it.id; if (selKey === "selT") S.selRed = false; save();
      keepFocus(() => { renderLodging(); renderTransport(); }); refreshLight();
    }
    const del = e.target.closest("[data-del]");
    if (del) {
      if (!confirm(`Delete “${it.name}”?`)) return;
      S[listName] = S[listName].filter(x => x !== it);
      if (S[selKey] === it.id) { S[selKey] = S[listName][0]?.id; if (selKey === "selT") S.selRed = false; }
      save(); rerender(); refreshLight(); toast("Deleted.");
    }
  });
}

// plan actions
function summaryText() {
  const ms = monthsList(), per = ms.reduce((s, m) => s + monthEarn(m.cal), 0), g = goal();
  return [`FSU Weightlifting: ${S.trip.dest || "trip"} fundraising plan`,
    `Trip: ${selL()?.name || "none"} + ${selT()?.name || "none"}, ${selN()} nights${selRed() ? " (red-eye home)" : ""} = ${usd(tripTotal())} (${usd(tripTotal() / Math.max(1, num(S.team.people)))} per person)`,
    `Goal: ${usd(g)} for ${S.team.people} lifters over ${ms.length} months (${ms[0].label} to ${ms[ms.length - 1].label}). Need ${usd(neededPerMonth(), 2)} per lifter per month.`,
    `Monthly shifts per lifter:`, ...planJobs().map(j => `  • ${S.plan[j.id]}× ${j.title} (${usd(earn(j))} a shift)`),
    `Each lifter raises ${usd(per)}. The team raises ${usd(plannedTotal())} against a ${usd(g)} goal.`].join("\n");
}
$("#copyBtn").onclick = async () => {
  try { await navigator.clipboard.writeText(summaryText()); toast("Summary copied."); }
  catch (e) { prompt("Copy this summary:", summaryText()); }
};
$("#printBtn").onclick = () => window.print();
$("#exportBtn").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: "application/json" }));
  a.download = "fsu-lifting-budget.json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast("Backup file saved.");
};
$("#importBtn").onclick = () => $("#importFile").click();
$("#importFile").onchange = async e => {
  try {
    const d = JSON.parse(await e.target.files[0].text());
    if (!d.team || !d.jobs || !d.lodging || !d.transport) throw 0;
    S = normalize(d); save(); heroFirst = true; renderAll(); toast("Backup loaded.");
  } catch (err) { toast("Not a planner backup."); }
  e.target.value = "";
};
$("#resetBtn").onclick = () => { if (confirm("Reset everything back to the starting sample data? This can't be undone.")) { S = defaults(); save(); heroFirst = true; openCards.clear(); renderAll(); toast("Back to the starting data."); } };

renderAll();
autoDiscover();

</script>
</body>
</html>
